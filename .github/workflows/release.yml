name: Release

# Triggered by pushing a tag like v1.2.0. Builds the server binaries (linux
# amd64/arm64, for deploy/install.sh) and a signed Android release APK from
# apps/mobile, and attaches both to a GitHub Release.
#
# iOS is not built here: real-device distribution requires an Apple Developer
# Program account ($99/yr) for signing, which this project doesn't have yet.
# Once enrolled, either add a macOS-runner job here with fastlane/manual
# codesigning, or build iOS through EAS (`eas build --platform ios`) while
# keeping Android on this workflow.

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  server:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      - name: Build
        working-directory: server
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: go build -o caller-linux-${{ matrix.arch }} .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: server/caller-linux-${{ matrix.arch }}
          generate_release_notes: true

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install JS deps
        run: npm ci

      - name: Generate native android/ project
        run: npx expo prebuild --platform android --no-install

      - name: Write release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d \
            > android/app/release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Patch build.gradle for release signing
        run: node scripts/patch-android-signing.js

      - name: Build release APK
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
            caller-${{ github.ref_name }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apps/mobile/caller-${{ github.ref_name }}.apk
          generate_release_notes: true
